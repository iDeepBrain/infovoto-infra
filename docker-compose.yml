name: infovoto

networks:
  infovoto:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  metabase-data:

services:
  # ── Core ───────────────────────────────────────────

  gateway:
    build:
      context: ../infovoto-gateway
      dockerfile: Dockerfile
    ports:
      - "2080:8080"
    env_file:
      - ../.env.secrets
      - ../.env.config
    environment:
      - DATABASE_URL=postgresql+asyncpg://infovoto:localdev@postgres:5432/infovoto
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      infovoto-mcp:
        condition: service_healthy
    volumes:
      - ../infovoto-gateway/src:/app/src
      - ../infovoto-gateway/tests:/app/tests
      - ../infovoto-gateway/migrations:/app/migrations
      - ../infovoto-gateway/alembic.ini:/app/alembic.ini
    networks:
      - infovoto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ../infovoto-web
      dockerfile: Dockerfile
    ports:
      - "2300:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:2300
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway:8080
      - HOSTNAME=0.0.0.0
    env_file: ../infovoto-web/.env.local
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - infovoto
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({hostname: require('os').hostname(), port: 3000, path: '/'}, r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── MCP Service (todos los MCPs en 1) ──────────────

  infovoto-mcp:
    build:
      context: ../infovoto-mcp
      dockerfile: Dockerfile
    ports:
      - "2900:8080"
    env_file:
      - ../.env.secrets
      - ../.env.config
    environment:
      - DATABASE_URL=postgresql+asyncpg://infovoto:localdev@postgres:5432/infovoto
      - ENVIRONMENT=development
      # ChromaDB lee desde la misma carpeta donde el scraper escribe
      - CHROMA_PERSIST_DIR=/app/scraper_data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../infovoto-mcp/src:/app/src
      - ../infovoto-mcp/tests:/app/tests
      # Datos procesados por el scraper (ChromaDB planes_gobierno, etc.)
      - ../infovoto-scraper/data:/app/scraper_data
    networks:
      - infovoto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Scraper Job (manual trigger) ───────────────────

  scraper:
    build:
      context: ../infovoto-scraper
      dockerfile: Dockerfile
    env_file:
      - ../.env.secrets
      - ../.env.config
    environment:
      - DATABASE_URL=postgresql+asyncpg://infovoto:localdev@postgres:5432/infovoto
      - ENVIRONMENT=development
      - DOWNLOAD_DIR=/app/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../infovoto-scraper/src:/app/src
      - ../infovoto-scraper/data:/app/data
    networks:
      - infovoto
    profiles:
      - scraper

  # ── Eval Pipeline (job — docker compose run) ───────

  eval:
    build:
      context: ../infovoto-gateway
      dockerfile: Dockerfile.eval
    environment:
      - GATEWAY_URL=http://gateway:8080
    env_file:
      - ../.env.secrets
      - ../.env.config
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ../infovoto-gateway/tests:/app/tests
    networks:
      - infovoto
    profiles:
      - eval

  # ── Dev Tools ──────────────────────────────────────

  gradio:
    build:
      context: ../infovoto-gradio
      dockerfile: Dockerfile
    ports:
      - "2860:7860"
    environment:
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ../infovoto-gradio:/app
    networks:
      - infovoto
    profiles:
      - dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Infra ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "2432:5432"
    environment:
      POSTGRES_DB: infovoto
      POSTGRES_USER: infovoto
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - infovoto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infovoto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "2379:6379"
    volumes:
      - redis-data:/data
    networks:
      - infovoto
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    ports:
      - "2010:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: infovoto
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: infovoto
      MB_DB_PASS: localdev
      MB_JAVA_TOOL_OPTIONS: -Xmx512m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./metabase-data:/metabase-data
    networks:
      - infovoto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
