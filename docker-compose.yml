name: infovoto

networks:
  infovoto:
    driver: bridge

volumes:
  pgdata:
  redis-data:

services:
  # ── Core ───────────────────────────────────────────

  gateway:
    build:
      context: ../infovoto-gateway
      dockerfile: Dockerfile
    ports:
      - "2080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://infovoto:localdev@postgres:5432/infovoto
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      # Demo: solo el MCP mock (no requiere DB con datos). Cambiar a MCPs reales cuando estén cargados.
      - MCP_URLS=http://infovoto-mcp:8080/demo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      infovoto-mcp:
        condition: service_started
    volumes:
      - ../infovoto-gateway/src:/app/src
      - ../infovoto-gateway/tests:/app/tests
    networks:
      - infovoto
    restart: unless-stopped

  web:
    build:
      context: ../infovoto-web
      dockerfile: Dockerfile
    ports:
      - "2300:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:2300
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway:8080
    env_file: ../infovoto-web/.env.local
    depends_on:
      - gateway
    networks:
      - infovoto
    restart: unless-stopped

  # ── MCP Service (todos los MCPs en 1) ──────────────

  infovoto-mcp:
    build:
      context: ../infovoto-mcp
      dockerfile: Dockerfile
    ports:
      - "2900:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://infovoto:localdev@postgres:5432/infovoto
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../infovoto-mcp/src:/app/src
      - ../infovoto-mcp/tests:/app/tests
    networks:
      - infovoto
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Scraper Job (manual trigger) ───────────────────

  scraper:
    build:
      context: ../infovoto-scraper
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://infovoto:localdev@postgres:5432/infovoto
      - ENVIRONMENT=development
      - DOWNLOAD_DIR=/app/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../infovoto-scraper/src:/app/src
      - ../infovoto-scraper/data:/app/data
    networks:
      - infovoto
    profiles:
      - scraper

  # ── Dev Tools ──────────────────────────────────────

  gradio:
    build:
      context: ../infovoto-gradio
      dockerfile: Dockerfile
    ports:
      - "2860:7860"
    environment:
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      - gateway
    volumes:
      - ../infovoto-gradio:/app
    networks:
      - infovoto
    profiles:
      - dev
    restart: unless-stopped

  # ── Infra ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "2432:5432"
    environment:
      POSTGRES_DB: infovoto
      POSTGRES_USER: infovoto
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - infovoto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infovoto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "2379:6379"
    volumes:
      - redis-data:/data
    networks:
      - infovoto
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
